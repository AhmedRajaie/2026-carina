<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Trading Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root { color-scheme: dark; --page:#0b1220; --panel:#111a2b; --line:#263653; --muted:#93a4bd; }
    body { font-family: system-ui, sans-serif; max-width:1100px; margin:0 auto; padding:32px 24px; background:var(--page); color:#e6edf3; }
    header { display:flex; align-items:end; justify-content:space-between; gap:24px; margin-bottom:24px; }
    h1 { margin:0; font-weight:650; letter-spacing:.01em; }
    .subtitle { color:var(--muted); margin:.4rem 0 0; }
    label { color:var(--muted); display:block; font-size:.8rem; margin-bottom:6px; }
    select { background:var(--panel); border:1px solid var(--line); border-radius:6px; color:#e6edf3; padding:9px 32px 9px 10px; font:inherit; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:20px; margin-bottom:20px; }
    .panel h2 { font-size:1rem; margin:0 0 16px; }
    .metrics { display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; }
    .metric { border-left:3px solid #7ee787; padding:10px 14px; background:#162239; }
    .metric-label { color:var(--muted); font-size:.8rem; }
    .metric-value { display:block; font-size:1.35rem; font-weight:600; margin-top:4px; }
    @media (max-width:600px) { body { padding:20px 14px; } header { align-items:start; flex-direction:column; } .metrics { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Trading Dashboard</h1>
      <p class="subtitle">EGX strategy monitor</p>
    </div>
    <div>
      <label for="symbolSelect">Stock</label>
      <select id="symbolSelect"></select>
    </div>
  </header>
  <div class="panel" id="status">connecting…</div>
  <div class="panel">
    <h2 id="priceTitle">Closing price and 20-day SMA</h2>
    <canvas id="priceChart"></canvas>
  </div>
  <div class="panel">
    <h2>Strategy vs EGX30 equity</h2>
    <canvas id="equityChart"></canvas>
  </div>
  <div class="panel">
    <h2>Strategy metrics</h2>
    <div class="metrics">
      <div class="metric"><span class="metric-label">Total return</span><span class="metric-value" id="totalReturn">—</span></div>
      <div class="metric"><span class="metric-label">Sharpe ratio</span><span class="metric-value" id="sharpe">—</span></div>
      <div class="metric"><span class="metric-label">Max drawdown</span><span class="metric-value" id="maxDrawdown">—</span></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
