<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Trading Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #08111f;
      --panel: #111c2e;
      --panel-soft: #162338;
      --border: #23324a;
      --text: #edf3f8;
      --muted: #91a4ba;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }
    main { width: min(1440px, calc(100% - 40px)); margin: 0 auto; padding: 32px 0 48px; }
    header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    h1 { margin: 0 0 6px; font-size: clamp(1.8rem, 3vw, 2.5rem); letter-spacing: -0.04em; }
    h2 { margin: 0; font-size: 1.05rem; }
    p { margin: 0; color: var(--muted); }
    .status {
      flex: 0 0 auto;
      padding: 8px 12px;
      border: 1px solid rgba(63, 185, 80, 0.35);
      border-radius: 999px;
      background: rgba(63, 185, 80, 0.12);
      color: #7ee787;
      font-size: 0.86rem;
      font-weight: 700;
    }
    .panel {
      margin-bottom: 20px;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.18);
    }
    .panel-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    .selector { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 0.9rem; }
    select {
      min-width: 120px;
      padding: 8px 34px 8px 11px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--panel-soft);
      color: var(--text);
      font: inherit;
    }
    .chart-wrap { position: relative; height: 390px; }
    .equity-layout { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 20px; align-items: stretch; }
    .metrics { display: grid; gap: 12px; }
    .metric { display: flex; flex-direction: column; justify-content: center; padding: 18px; border: 1px solid var(--border); border-radius: 12px; background: var(--panel-soft); }
    .metric-label { margin-bottom: 7px; color: var(--muted); font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; }
    .metric-value { font-size: 1.65rem; font-weight: 750; font-variant-numeric: tabular-nums; }
    .feature-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 24px; }
    .feature-row { display: grid; grid-template-columns: 110px minmax(80px, 1fr) 72px; align-items: center; gap: 10px; }
    .feature-name { overflow: hidden; color: var(--muted); font-size: 0.84rem; text-overflow: ellipsis; white-space: nowrap; }
    .feature-track { position: relative; height: 9px; overflow: hidden; border-radius: 999px; background: var(--panel-soft); }
    .feature-track::after { position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: var(--border); content: ""; }
    .feature-bar { position: absolute; top: 0; bottom: 0; z-index: 1; border-radius: 999px; background: #58a6ff; }
    .feature-bar.negative { background: #f85149; }
    .feature-value { text-align: right; font-size: 0.84rem; font-variant-numeric: tabular-nums; }
    @media (max-width: 820px) {
      main { width: min(100% - 24px, 1440px); padding-top: 22px; }
      header, .panel-heading { align-items: flex-start; flex-direction: column; }
      .equity-layout { grid-template-columns: 1fr; }
      .metrics { grid-template-columns: repeat(3, 1fr); }
      .feature-list { grid-template-columns: 1fr; }
      .chart-wrap { height: 320px; }
    }
    @media (max-width: 560px) {
      .metrics { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Trading Dashboard</h1>
        <p>EGX market signals and SMA crossover performance</p>
      </div>
      <div class="status" id="status">connecting…</div>
    </header>

    <section class="panel">
      <div class="panel-heading">
        <h2>Price &amp; 20-Day SMA</h2>
        <label class="selector" for="symbolSelect">
          Symbol
          <select id="symbolSelect" aria-label="Stock symbol"></select>
        </label>
      </div>
      <div class="chart-wrap"><canvas id="priceChart"></canvas></div>
    </section>

    <section class="panel">
      <div class="panel-heading">
        <div>
          <h2>Model input (features)</h2>
          <p>Latest saved feature snapshot</p>
        </div>
      </div>
      <div class="feature-list" id="featureList"></div>
    </section>

    <section class="panel">
      <div class="panel-heading">
        <div>
          <h2>Strategy Equity vs EGX30</h2>
          <p>Starting capital: 1,000 EGP</p>
        </div>
      </div>
      <div class="equity-layout">
        <div class="chart-wrap"><canvas id="equityChart"></canvas></div>
        <aside class="metrics" aria-label="Strategy metrics">
          <div class="metric"><span class="metric-label">Total return</span><span class="metric-value" id="totalReturn">—</span></div>
          <div class="metric"><span class="metric-label">Sharpe ratio</span><span class="metric-value" id="sharpe">—</span></div>
          <div class="metric"><span class="metric-label">Max drawdown</span><span class="metric-value" id="maxDrawdown">—</span></div>
        </aside>
      </div>
    </section>
    <!-- TASK_07+ : add later dashboard panels -->
  </main>
  <script src="app.js"></script>
</body>
</html>
